<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Store Sales</title>
</head>

<body class="bg-stone-100 text-stone-900 min-h-screen flex items-center justify-center h-screen">
  <section id="login-view" class="min-h-screen flex items-center justify-center p-4">
    <div
      class="w-full max-w-[960px] grid md:grid-cols-2 items-center gap-6 lg:gap-20 bg-[#EEEEEE] rounded-2xl overflow-hidden">

      <div class="relative hidden md:block">
        <img src="assets/signup-background.svg" alt="" />
        <img src="assets/teamwork.svg" alt="" class="absolute top-36" />
      </div>

      <div class="w-full max-w-80 mx-auto grid gap-5 p-6 md:p-0">
        <h1 class="text-2xl font-bold text-gray-500">This is Where you Sign In</h1>
        <p>Access our Store Sales Dashboard</p>

        <form id="loginForm" class="space-y-6 text-gray-500">
          <div class="relative">
            <div class="absolute top-1 left-1 rounded-full p-2 flex items-center justify-center">
              <i class="fa-solid fa-envelope-open"></i>
            </div>
            <input type="email" id="email" placeholder="Email Address" aria-label="Email address" required
              class="w-full py-2 px-12 rounded-full" />
          </div>

          <div class="relative">
            <div class="absolute top-1 left-1 rounded-full p-2 flex items-center justify-center">
              <i class="fa-solid fa-lock"></i>
            </div>
            <input type="password" id="password" placeholder="Password" aria-label="Password" required
              class="w-full py-2 px-12 rounded-full" />
          </div>

          <button type="submit" class="bg-[#6144D5] w-full text-white font-semibold rounded-full py-2">
            Sign in
          </button>
        </form>

        <div class="border-t border-stone-300 pt-4 space-y-4 text-sm">
          <p>Don't have an account? <a class="text-[#4382FF] font-semibold cursor-pointer">Sign Up</a></p>
          <p>Forgot password? <a class="text-[#4382FF] font-semibold cursor-pointer">Reset password</a></p>
          <p>Don't have a password yet? <a class="text-[#4382FF] font-semibold cursor-pointer">Set password</a></p>
          <p id="errorMessage" class="text-sm"></p>
        </div>
      </div>
    </div>
  </section>

   <section id="dashboard-view" class="hidden mx-auto max-w-6xl p-4 lg:p-8 space-y-6">
    <h1 class="text-2xl font-bold lg:text-3xl">Store Sales Dashboard</h1>

    <!-- The Three Stats -->
     
    <div class="grid gap-4 sm:grid-cols-3">
      <div class="bg-white rounded-lg shadow p-4">
        <p class="text-sm text-stone-600">Total revenue</p>
        <p id="stat-revenue" class="text-2xl font-semibold"></p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <p class="text-sm text-stone-600">Pending orders</p>
        <p id="stat-pending" class="text-2xl font-semibold"></p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <p class="text-sm text-stone-600">Average order value</p>
        <p id="stat-average" class="text-2xl font-semibold"></p>
      </div>
    </div>

    <!-- Add order form -->
    <form id="order-form" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
      <input type="text" id="product-name" placeholder="Product name" aria-label="Product name"
        class="border border-gray-300 rounded-md p-2 bg-white">
      <input type="number" id="unit-price" placeholder="Unit price (RWF)" aria-label="Unit price in RWF"
        class="border border-gray-300 rounded-md p-2 bg-white">
      <input type="number" id="quantity" placeholder="Quantity" aria-label="Quantity"
        class="border border-gray-300 rounded-md p-2 bg-white">
      <button type="submit" class="bg-teal-700 hover:bg-teal-800 p-2 text-white rounded-md">Add order</button>
    </form>

    <!-- Search + filters -->
    <div class="flex flex-col gap-3 md:flex-row md:items-center">
      <input id="search" type="text" placeholder="Search product..." aria-label="Search product"
        class="border border-gray-300 rounded-md p-2 bg-white md:flex-1">

      <select id="status" aria-label="Filter by status" class="border border-gray-300 rounded-md p-2 bg-white">
        <option value="All">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="Shipped">Shipped</option>
        <option value="Delivered">Delivered</option>
        <option value="Cancelled">Cancelled</option>
      </select>

      <label class="flex items-center gap-2">
        <input type="checkbox" id="outOfStock" class="h-4 w-4">
        Out of stock only
      </label>
    </div>

    <!-- Orders table (rows are built by showOrders) -->
    <div>
      <p id="resultCount" class="text-sm text-stone-600 mb-2"></p>
      <div class="overflow-x-auto bg-white rounded-lg shadow">
        <table class="w-full text-left text-sm">
          <thead class="bg-stone-50 text-stone-600">
            <tr>
              <th class="px-4 py-3 font-medium">Product</th>
              <th class="px-4 py-3 font-medium">Unit price</th>
              <th class="px-4 py-3 font-medium">Qty</th>
              <th class="px-4 py-3 font-medium">Order total</th>
              <th class="px-4 py-3 font-medium">Status</th>
              <th class="px-4 py-3 font-medium">Stock</th>
            </tr>
          </thead>
          <tbody id="list"></tbody>
        </table>
      </div>
    </div>
  </section>

  <script src="index.js"></script>
</body>

</html>
