<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Store Sales</title>
    <style></style>
</head>

<body class="bg-stone-100 text-stone-900 min-h-screen">

    <section id="login-view" class="min-h-screen flex items-center justify-center p-4"></section>

    <section id="dashboard-view" class="hidden p-4">

        <!-- Feature 6: Search products -->
        <input
            id="search"
            type="text"
            placeholder="Search product..."
            oninput="showOrders()"
            class="border p-2 mb-4"
        >

        <!-- Feature 4: Status Filter -->
        <select id="status" onchange="showOrders()" class="border p-2">
            <option>All Statuses</option>
            <option>Pending</option>
            <option>Shipped</option>
            <option>Delivered</option>
            <option>Cancelled</option>
        </select>

        <!-- Feature 5: Out-of-Stock Filter -->
        <label class="ml-2">
            <input type="checkbox" id="outOfStock" onchange="showOrders()">
            Out of stock only
        </label>

        <!-- Orders table -->
        <table class="w-full bg-white mt-4 shadow">
            <tbody id="list"></tbody>
        </table>

    </section>

    <script src="index.js"></script>

</body>

</html>
