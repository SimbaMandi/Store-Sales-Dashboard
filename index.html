<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6 bg-gray-100">

  <div class="max-w-3xl mx-auto">
    <h1 class="text-2xl font-bold mb-4">Orders</h1>

    <!-- Feature 6: search -->
    <input id="search" placeholder="Search product..." oninput="showOrders()" class="border p-2">

    <!-- Feature 4: status dropdown -->
    <select id="status" onchange="showOrders()" class="border p-2">
      <option>All Statuses</option>
      <option>Pending</option>
      <option>Shipped</option>
      <option>Delivered</option>
      <option>Cancelled</option>
    </select>

    <!-- Feature 5: out of stock checkbox -->
    <label class="ml-2">
      <input type="checkbox" id="outOfStock" onchange="showOrders()"> Out of stock only
    </label>

    <table class="w-full bg-white mt-4 shadow">
      <tbody id="list"></tbody>
    </table>
  </div>

  <script src="index.js"></script>
</body>
</html>
